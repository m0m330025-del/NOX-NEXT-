name: NOX Face Landmarks Engine Checks

on:
  pull_request:
    branches: [main]
    paths:
      - "core/nox-bisenet-face-parsing-provider.js"
      - "tests/nox-bisenet-face-parsing-provider.test.mjs"
      - "core/nox-face-landmarks-engine.js"
      - "core/nox-face-landmark-temporal-tracker.js"
      - "tests/nox-face-landmark-temporal-tracker.test.mjs"
      - "core/nox-mediapipe-face-landmarker-provider.js"
      - "core/nox-facial-mask-builder.js"
      - "core/nox-face-topology-intelligence.js"
      - "core/nox-face-research-suite.js"
      - "core/nox-face-digital-twin-diagnostics.js"
      - "core/camera.js"
      - "core/nox-cortex.js"
      - "core/nox-optical-flow-engine.js"
      - "tests/nox-cortex.test.mjs"
      - "tests/nox-optical-flow-engine.test.mjs"
      - "tests/nox-face-digital-twin-diagnostics.test.mjs"
      - "tests/nox-face-landmarks-engine.test.mjs"
      - "tests/nox-mediapipe-face-landmarker-provider.test.mjs"
      - "tests/nox-facial-mask-builder.test.mjs"
      - "tests/nox-face-topology-intelligence.test.mjs"
      - "tests/nox-face-research-suite.test.mjs"
      - ".github/workflows/face-landmarks-engine-checks.yml"
  push:
    branches: ["feature/nox-camera-engine-rebuild"]
    paths:
      - "core/nox-bisenet-face-parsing-provider.js"
      - "tests/nox-bisenet-face-parsing-provider.test.mjs"
      - "core/nox-face-landmarks-engine.js"
      - "core/nox-face-landmark-temporal-tracker.js"
      - "tests/nox-face-landmark-temporal-tracker.test.mjs"
      - "core/nox-mediapipe-face-landmarker-provider.js"
      - "core/nox-facial-mask-builder.js"
      - "core/nox-face-topology-intelligence.js"
      - "tests/nox-face-landmarks-engine.test.mjs"
      - "tests/nox-facial-mask-builder.test.mjs"
      - "tests/nox-face-topology-intelligence.test.mjs"
      - "core/nox-face-research-suite.js"
      - "core/nox-face-digital-twin-diagnostics.js"
      - "core/camera.js"
      - "core/nox-cortex.js"
      - "core/nox-optical-flow-engine.js"
      - "tests/nox-cortex.test.mjs"
      - "tests/nox-optical-flow-engine.test.mjs"
      - "tests/nox-face-research-suite.test.mjs"
      - "tests/nox-face-digital-twin-diagnostics.test.mjs"
      - ".github/workflows/face-landmarks-engine-checks.yml"

permissions:
  contents: read

jobs:
  face-landmarks-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Prepare ESM source copies
        run: |
          cp core/nox-bisenet-face-parsing-provider.js core/nox-bisenet-face-parsing-provider.mjs
          cp core/nox-face-landmarks-engine.js core/nox-face-landmarks-engine.mjs
          cp core/nox-face-landmark-temporal-tracker.js core/nox-face-landmark-temporal-tracker.mjs
          cp core/nox-mediapipe-face-landmarker-provider.js core/nox-mediapipe-face-landmarker-provider.mjs
          cp core/nox-facial-mask-builder.js core/nox-facial-mask-builder.mjs
          cp core/nox-face-topology-intelligence.js core/nox-face-topology-intelligence.mjs
          cp core/nox-face-research-suite.js core/nox-face-research-suite.mjs
      - name: Check syntax
        run: |
          node --check core/nox-bisenet-face-parsing-provider.mjs
          node --check core/nox-face-landmarks-engine.mjs
          node --check core/nox-face-landmark-temporal-tracker.mjs
          node --check core/nox-mediapipe-face-landmarker-provider.mjs
          node --check core/nox-facial-mask-builder.mjs
          node --check core/nox-face-topology-intelligence.mjs
          node --check core/nox-face-research-suite.mjs
          node --experimental-default-type=module --check core/nox-face-digital-twin-diagnostics.js
          node --experimental-default-type=module --check core/camera.js
          node --experimental-default-type=module --check core/nox-cortex.js
      - name: Run BiSeNet face parsing provider tests
        run: node tests/nox-bisenet-face-parsing-provider.test.mjs
      - name: Run landmark region tests
        run: node tests/nox-face-landmarks-engine.test.mjs
      - name: Run live landmark temporal tracking tests
        run: node tests/nox-face-landmark-temporal-tracker.test.mjs
      - name: Run MediaPipe provider contract tests
        run: node tests/nox-mediapipe-face-landmarker-provider.test.mjs
      - name: Run facial mask geometry tests
        run: node tests/nox-facial-mask-builder.test.mjs
      - name: Run face topology intelligence tests
        run: node tests/nox-face-topology-intelligence.test.mjs
      - name: Run face research suite tests
        run: node tests/nox-face-research-suite.test.mjs
      - name: Run Face Digital Twin camera diagnostic contract tests
        run: node --experimental-default-type=module tests/nox-face-digital-twin-diagnostics.test.mjs
      - name: Run NOX CORTEX orchestration tests
        run: node --experimental-default-type=module tests/nox-cortex.test.mjs
      - name: Run NOX sparse optical flow engine tests
        run: node --experimental-default-type=module tests/nox-optical-flow-engine.test.mjs
