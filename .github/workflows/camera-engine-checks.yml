name: NOX Camera Engine Checks

on:
  pull_request:
    branches: [main]
    paths:
      - "core/camera.js"
      - "core/nox-filter-engine.js"
      - "app.js"
      - "index.html"
      - "camera.css"
      - ".github/workflows/camera-engine-checks.yml"
  push:
    branches: ["feature/nox-camera-engine-rebuild"]
    paths:
      - "core/camera.js"
      - "core/nox-filter-engine.js"
      - "docs/NOX-CAMERA-INNOVATIONS.md"
      - "app.js"
      - "index.html"
      - "camera.css"
      - ".github/workflows/camera-engine-checks.yml"

permissions:
  contents: read

jobs:
  syntax-and-markup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check browser module syntax
        run: |
          cp core/camera.js /tmp/camera.mjs
          cp app.js /tmp/app.mjs
          cp core/nox-filter-engine.js /tmp/filter-engine.mjs
          node --check /tmp/camera.mjs
          node --check /tmp/app.mjs
          node --check /tmp/filter-engine.mjs
      - name: Check camera markup hooks
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const html = fs.readFileSync('index.html', 'utf8');
          const js = fs.readFileSync('core/camera.js', 'utf8');
          const required = [
            'nox-camera-video', 'nox-camera-stage', 'nox-camera-start',
            'nox-camera-state', 'nox-camera-status', 'nox-camera-flip',
            'nox-camera-stop', 'nox-camera-capture', 'nox-camera-record',
            'nox-camera-render', 'nox-lens-orbit', 'nox-lens-track',
            'nox-camera-caption', 'nox-camera-file', 'nox-camera-result',
            'nox-camera-photo', 'nox-camera-video-result', 'nox-camera-save',
            'nox-living-metal-toggle', 'nox-living-metal-hint', 'nox-filter-select',
            'nox-region-mask-toggle', 'nox-region-mask-clear', 'nox-region-mask-hint', 'nox-region-mask-overlay',
            'nox-temporal-mode', 'nox-temporal-clear', 'nox-temporal-hint',
            'nox-flow-mode', 'nox-flow-clear', 'nox-flow-hint', 'nox-region-follow-toggle', 'nox-region-follow-hint', 'nox-subject-lock-toggle', 'nox-subject-lock-hint', 'nox-motion-prediction-toggle', 'nox-motion-prediction-hint', 'nox-stabilizer-toggle', 'nox-stabilizer-hint', 'nox-low-light-mode', 'nox-low-light-hint', 'nox-detail-recovery-mode', 'nox-detail-recovery-hint', 'nox-motion-freeze-toggle', 'nox-motion-freeze-cancel', 'nox-motion-freeze-hint', 'nox-wave-matter-mode', 'nox-wave-matter-hint', 'nox-science-mode', 'nox-science-hint',
            'nox-photon-timeline-toggle', 'nox-photon-timeline-preview', 'nox-photon-timeline-scrub',
            'nox-photon-timeline-best', 'nox-photon-timeline-save', 'nox-photon-timeline-clear', 'nox-photon-timeline-hint',
            'nox-photon-fusion-build', 'nox-photon-fusion-save',
            'nox-photon-confidence-build', 'nox-photon-confidence-map', 'nox-photon-confidence-hint'
          ];
          const missing = required.filter(id => !html.includes('id="' + id + '"'));
          if (missing.length) {
            console.error('Missing camera elements:', missing.join(', '));
            process.exit(1);
          }
          for (const id of required) {
            if (!js.includes('#' + id)) {
              console.error('Camera module does not reference expected element:', id);
              process.exit(1);
            }
          }
          for (const token of ['drawLivingMetal', 'livingMetalEnabled', 'livingMetalRegion',
            'normalizedPoint', 'buildRegionMask', 'updateRegionMaskOverlay', 'regionMaskDrawing', 'regionMaskEnabled',
            'resetTemporalMemory', 'ensureTemporalMemory', 'renderTemporalMemory', 'setTemporalMode',
            'resetOpticalFlow', 'estimateOpticalFlow', 'drawOpticalFlow', 'setOpticalFlowMode',
            'updateTrackedRegionFromFlow', 'setRegionFollowEnabled', 'regionFollowEnabled', 'setSubjectLockEnabled', 'updateSubjectLock', 'subjectLockTemplate', 'subjectLockConfidence', 'subjectLockLostFrames', 'subjectLockReacquireAttempts', 'distinctMatchMargin', 'ambiguousReacquire', 'setMotionPredictionEnabled', 'motionPredictionEnabled', 'subjectLockVelocity', 'searchCenterX', 'searchCenterY', 'leadLimit', 'updateCameraStabilization', 'setCameraStabilizationEnabled', 'cameraStabilizationEnabled', 'stabilizationOffset', 'stabilizationConfidence', 'drawStabilizedSource', 'setLowLightMode', 'lowLightMode', 'u_lowLight', 'u_texel', 'u_detail', 'detailSignal', 'detailGate']) {
            if (!js.includes(token)) {
              console.error('Living Metal implementation token missing:', token);
              process.exit(1);
            }
          }
          console.log('Camera markup hooks present:', required.length);
          const filterEngine = fs.readFileSync('core/nox-filter-engine.js', 'utf8');
          for (const token of ['NOX_FILTERS', 'NOX_FILTER_GROUPS', 'getFallbackFilter']) {
            if (!filterEngine.includes(token)) throw new Error('Filter engine export missing: ' + token);
          }
          const catalogMatch = filterEngine.match(/(\[[^\n]+\])/);
          if (!catalogMatch) throw new Error('Filter catalog data missing');
          const groups = JSON.parse(catalogMatch[1]);
          const totalFilters = groups.reduce((sum, group) => sum + group[1].length, 0);
          if (totalFilters !== 200 || groups.length !== 10) throw new Error('Expected 200 filters in 10 groups, got ' + totalFilters);
          for (const token of ['u_variant', 'u_time', 'family < 8.5']) {
            if (!js.includes(token)) throw new Error('GPU filter family shader missing: ' + token);
          }
          console.log('Living Metal prototype hooks present: 3');
          console.log('Manual region mask hooks present: 3');
          if (!js.includes('lowPower ? 160 : 224') || !js.includes('lowPower ? 3 : 4')) {
            throw new Error('Temporal memory must retain bounded low-power and standard buffer sizes');
          }
          console.log('Temporal memory engine hooks and bounded buffer profile verified');
          for (const token of ['lowPower ? 48 : 64', 'lowPower ? 36 : 48', 'lowPower ? 2 : 3', 'getImageData']) {
            if (!js.includes(token)) throw new Error('Optical flow low-resolution bounded sampling missing: ' + token);
          }
          console.log('Sparse optical flow bounded sampling hooks verified');
          for (const token of ['dx: -bestDx / sampleWidth', 'regionFollowLastSequence', 'count < 2', 'Math.max(-0.025']) {
            if (!js.includes(token)) throw new Error('Region-follow confidence and motion guard missing: ' + token);
          }
          console.log('Reality Follow confidence and displacement guards verified');
          for (const token of ['meanSad > 38', 'subjectLockConfidence < 0.46', 'subjectLockLostFrames >= 2', 'variance < 12']) {
            if (!js.includes(token)) throw new Error('Subject Lock confidence/loss guard missing: ' + token);
          }
          console.log('Subject Lock bounded template matching and loss guards verified');
          for (const token of ['subjectLockLostFrames >= 2', 'lowPower ? 9 : 14', 'distinctMatchMargin < 1.5', 'meanSad > 25', 'subjectLockWasReacquired']) {
            if (!js.includes(token)) throw new Error('Subject Lock safe re-acquisition guard missing: ' + token);
          }
          console.log('Subject Lock conservative re-acquisition guards verified');
          for (const token of ['subjectLockVelocity.x * 0.62', 'observedDx * 0.38', 'lowPower ? 4 : 6', 'motionPredictionEnabled ? Math.max', 'subjectLockVelocity = { x: 0, y: 0 }']) {
            if (!js.includes(token)) throw new Error('Motion prediction smoothing or bounded lead missing: ' + token);
          }
          console.log('NOX Motion Prediction bounded lead and velocity smoothing verified');
          for (const token of ['stableVectors.length < 4', 'maxOffset = 0.025', 'stabilizationTarget.x - motionX * 0.72', 'stabilizationOffset.x * 0.76', 'const zoom = cameraStabilizationEnabled ? 1.06 : 1']) {
            if (!js.includes(token)) throw new Error('Smart Stabilizer confidence, crop, or smoothing guard missing: ' + token);
          }
          console.log('NOX Smart Stabilizer robust motion estimate and bounded crop verified');
          for (const token of ['darkMask = 1.0 - smoothstep', 'u_lowLight > 1.5', 'smoothstep(0.025, 0.16, edge1)', 'lowLightMode === "strong"', 'u_texel']) {
            if (!js.includes(token)) throw new Error('Low-light adaptive shadow/noise treatment missing: ' + token);
          }
          console.log('NOX Low-Light Rescue adaptive shadow and edge-aware smoothing verified');
          for (const token of ['detailSignal = centerLum - averageLum', 'smoothstep(0.012, 0.075, abs(detailSignal))', 'u_detail > 1.5', 'detailRecoveryMode === "strong"', 'updateMotionFreezeState', 'motionFreezeCaptureStartedAt', 'motionFreezeLastSpeed <= 0.9', '1400', 'nox-motion-freeze-cancel']) {
            if (!js.includes(token)) throw new Error('True Detail Recovery guarded detail enhancement missing: ' + token);
          }
          console.log('NOX True Detail Recovery thresholded local-detail enhancement verified');
          for (const token of ['motionFreezeEnabled', 'opticalFlowVectors.filter', 'motionFreezeLastSpeed <= 0.9', 'motionFreezeCaptureStartedAt', '1400', 'cancelMotionFreezeCapture', 'capturePhotoNow']) {
            if (!js.includes(token)) throw new Error('Motion Freeze bounded capture-assist behavior missing: ' + token);
          }
          console.log('NOX Motion Freeze motion-aware capture timing and timeout fallback verified');
          for (const token of ['u_waveMatter', 'filmThickness', 'phaseR', 'phaseG', 'phaseB', 'edgeGate', 'Rayleigh-like sky scattering grade', 'setWaveMatterMode', 'u_science', 'setScienceMode', 'fluorescence', 'polarization', 'light-field', 'spectral']) {
            if (!js.includes(token)) throw new Error('Wave Matter optical-physics simulation missing: ' + token);
          }
          console.log('NOX Wave Matter thin-film, dispersion, and atmospheric-scattering shader paths verified');
          for (const token of ['capturePhotonMoment', 'measurePhotonSharpness', 'getPhotonMotionEstimate', 'selectBestPhotonMoment', 'saveSelectedPhotonMoment', 'photonTimelineOrder', 'lowPower ? 192 : 256', 'lowPower ? 3 : 4', '220 : 150', 'nox-photon-timeline-scrub']) {
            if (!js.includes(token)) throw new Error('NOX PHOTON TIME MACHINE timeline implementation missing: ' + token);
          }
          console.log('NOX PHOTON TIME MACHINE bounded timeline, moment scoring, and preview hooks verified');
          for (const token of ['estimatePhotonAlignment', 'drawAlignedPhotonSlot', 'alignmentConfidence', 'alignmentValid', 'alignmentError', 'previousSlot.meta.alignmentValid && Boolean(alignment)', 'bestSad > 38', 'confidence < 0.035']) {
            if (!js.includes(token)) throw new Error('NOX Temporal Reconstruction alignment guard missing: ' + token);
          }
          console.log('NOX Temporal Reconstruction bounded global alignment and confidence guards verified');
          for (const token of ['buildPhotonDetailFusion', 'clearPhotonDetailFusion', 'savePhotonDetailFusion', 'photonFusionTilesUsed', 'meanDifference > 14', 'bestSharpness * 1.12', 'bestSharpness + 1.5', 'scratchSlots.forEach', 'photonFusionReferenceIndex']) {
            if (!js.includes(token)) throw new Error('NOX Temporal Detail Fusion safety or selection guard missing: ' + token);
          }
          console.log('NOX Temporal Detail Fusion conservative tile selection and cleanup guards verified');
          for (const token of ['buildPhotonConfidenceMap', 'clearPhotonConfidenceMap', 'photonConfidenceCounts', 'difference / samples <= 14', 'agreeing >= 2', 'photonConfidenceReferenceIndex']) {
            if (!js.includes(token)) throw new Error('NOX Temporal Confidence Map classification or invalidation guard missing: ' + token);
          }
          console.log('NOX Temporal Confidence Map evidence categories and reference invalidation verified');
          console.log('NOX filter catalog verified:', totalFilters, 'presets /', groups.length, 'families');
          NODE
