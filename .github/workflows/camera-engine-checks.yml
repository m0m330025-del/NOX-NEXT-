name: NOX Camera Engine Checks

on:
  pull_request:
    branches: [main]
    paths:
      - "core/camera.js"
      - "app.js"
      - "index.html"
      - "camera.css"
      - ".github/workflows/camera-engine-checks.yml"
  push:
    branches: ["feature/nox-camera-engine-rebuild"]
    paths:
      - "core/camera.js"
      - "app.js"
      - "index.html"
      - "camera.css"
      - ".github/workflows/camera-engine-checks.yml"

permissions:
  contents: read

jobs:
  syntax-and-markup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check browser module syntax
        run: |
          cp core/camera.js /tmp/camera.mjs
          cp app.js /tmp/app.mjs
          node --check /tmp/camera.mjs
          node --check /tmp/app.mjs
      - name: Check camera markup hooks
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const html = fs.readFileSync('index.html', 'utf8');
          const js = fs.readFileSync('core/camera.js', 'utf8');
          const required = [
            'nox-camera-video', 'nox-camera-stage', 'nox-camera-start',
            'nox-camera-state', 'nox-camera-status', 'nox-camera-flip',
            'nox-camera-stop', 'nox-camera-capture', 'nox-camera-record',
            'nox-camera-render', 'nox-lens-orbit', 'nox-lens-track',
            'nox-camera-caption', 'nox-camera-file', 'nox-camera-result',
            'nox-camera-photo', 'nox-camera-video-result', 'nox-camera-save',
            'nox-living-metal-toggle', 'nox-living-metal-hint', 'nox-filter-select'
          ];
          const missing = required.filter(id => !html.includes('id="' + id + '"'));
          if (missing.length) {
            console.error('Missing camera elements:', missing.join(', '));
            process.exit(1);
          }
          for (const id of required) {
            if (!js.includes('#' + id)) {
              console.error('Camera module does not reference expected element:', id);
              process.exit(1);
            }
          }
          for (const token of ['drawLivingMetal', 'livingMetalEnabled', 'livingMetalRegion']) {
            if (!js.includes(token)) {
              console.error('Living Metal implementation token missing:', token);
              process.exit(1);
            }
          }
          console.log('Camera markup hooks present:', required.length);
          const filterEngine = fs.readFileSync('core/nox-filter-engine.js', 'utf8');
          for (const token of ['NOX_FILTERS', 'NOX_FILTER_GROUPS', 'getFallbackFilter']) {
            if (!filterEngine.includes(token)) throw new Error('Filter engine export missing: ' + token);
          }
          const catalogMatch = filterEngine.match(/(\[[^\n]+\])/);
          if (!catalogMatch) throw new Error('Filter catalog data missing');
          const groups = JSON.parse(catalogMatch[1]);
          const totalFilters = groups.reduce((sum, group) => sum + group[1].length, 0);
          if (totalFilters !== 200 || groups.length !== 10) throw new Error('Expected 200 filters in 10 groups, got ' + totalFilters);
          for (const token of ['u_variant', 'u_time', 'family < 9.5']) {
            if (!js.includes(token)) throw new Error('GPU filter family shader missing: ' + token);
          }
          console.log('Living Metal prototype hooks present: 3');
          console.log('NOX filter catalog verified:', totalFilters, 'presets /', groups.length, 'families');
          NODE
