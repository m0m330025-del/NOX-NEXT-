name: NOX Skin Segmentation Engine Checks

on:
  pull_request:
    branches: [main]
    paths:
      - "core/nox-skin-segmentation-engine.js"
      - "tests/nox-skin-segmentation-engine.test.mjs"
      - ".github/workflows/skin-segmentation-engine-checks.yml"
  push:
    branches: ["feature/nox-camera-engine-rebuild"]
    paths:
      - "core/nox-skin-segmentation-engine.js"
      - "tests/nox-skin-segmentation-engine.test.mjs"
      - ".github/workflows/skin-segmentation-engine-checks.yml"

permissions:
  contents: read

jobs:
  skin-segmentation-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check engine syntax
        run: |
          cp core/nox-skin-segmentation-engine.js /tmp/nox-skin-segmentation-engine.mjs
          node --check /tmp/nox-skin-segmentation-engine.mjs
      - name: Run segmentation validation tests
        run: |
          cp core/nox-skin-segmentation-engine.js core/nox-skin-segmentation-engine.mjs
          node tests/nox-skin-segmentation-engine.test.mjs
