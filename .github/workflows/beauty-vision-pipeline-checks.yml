name: NOX Beauty Vision Pipeline Checks

on:
  pull_request:
    branches: [main]
    paths:
      - "core/nox-beauty-vision-pipeline.js"
      - "core/nox-beauty-vision-provider.js"
      - "core/nox-skin-segmentation-engine.js"
      - "core/nox-makeup-rendering-engine.js"
      - "core/nox-bisenet-face-parsing-provider.js"
      - "tests/nox-bisenet-face-parsing-provider.test.mjs"
      - "tests/nox-beauty-vision-pipeline.test.mjs"
      - ".github/workflows/beauty-vision-pipeline-checks.yml"
  push:
    branches: ["feature/nox-camera-engine-rebuild"]
    paths:
      - "core/nox-beauty-vision-pipeline.js"
      - "core/nox-beauty-vision-provider.js"
      - "core/nox-skin-segmentation-engine.js"
      - "core/nox-makeup-rendering-engine.js"
      - "core/nox-bisenet-face-parsing-provider.js"
      - "tests/nox-bisenet-face-parsing-provider.test.mjs"
      - "tests/nox-beauty-vision-pipeline.test.mjs"
      - ".github/workflows/beauty-vision-pipeline-checks.yml"

permissions:
  contents: read

jobs:
  beauty-vision-pipeline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Prepare ESM test copies
        run: |
          for file in nox-beauty-vision-pipeline nox-beauty-vision-provider nox-skin-segmentation-engine nox-makeup-rendering-engine; do
            cp "core/$file.js" "core/$file.mjs"
          done
      - name: Check pipeline syntax
        run: node --check core/nox-beauty-vision-pipeline.mjs
      - name: Run BiSeNet provider lifecycle tests
        run: node --experimental-default-type=module tests/nox-bisenet-face-parsing-provider.test.mjs
      - name: Run end-to-end contract tests
        run: node tests/nox-beauty-vision-pipeline.test.mjs
